<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Antigravity Accounts & Quotas</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Header -->
  <header>
    <div class="brand-wrapper">
      <div class="brand-logo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"></path>
          <path d="M2 12h20"></path>
        </svg>
      </div>
      <div>
        <h1 class="brand-title">
          Antigravity Accounts & Quotas
          <span class="badge-phase">Phase 1</span>
        </h1>
        <p class="brand-subtitle">Multi-Account Matrix & Gemini Daily Quota Orchestrator</p>
      </div>
    </div>

    <!-- Actions -->
    <div class="header-actions">
      <button onclick="refreshAllQuotas()" id="refreshBtn" class="btn btn-secondary">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
          <path d="M3 3v5h5"></path>
          <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"></path>
          <path d="M16 21h5v-5"></path>
        </svg>
        <span>Refresh Quotas</span>
      </button>
      <button onclick="startOAuth()" class="btn btn-primary">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        <span>Add Google Account</span>
      </button>
    </div>
  </header>

  <!-- Main Content -->
  <main>
    <!-- Active Status Summary Banner -->
    <div class="status-banner">
      <div class="status-indicator-wrap">
        <div class="pulse-dot"></div>
        <div>
          <span class="status-label">Current Antigravity IDE Account:</span>
          <p id="activeAccountHeader" class="status-value">Detecting...</p>
        </div>
      </div>
      <div id="accountCountBadge" class="status-badge">
        0 Accounts Registered
      </div>
    </div>

    <!-- Accounts Cards Grid -->
    <div id="accountsContainer" class="accounts-grid">
      <!-- Populated via accounts.js -->
    </div>
  </main>

  <script src="js/quotas.js"></script>
  <script src="js/accounts.js"></script>
</body>
</html>
